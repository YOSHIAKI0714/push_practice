name: USDJPY 2011-01-03 intraday multi-trade

on:
  push:
    paths: ['.github/workflows/usdjpy_20110103_intraday_multi.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pandas numpy scikit-learn requests beautifulsoup4
      - name: Train pre-2011 high-frequency model and trade 2011-01-03
        run: |
          python - <<'PY'
          import io, zipfile, time, requests, numpy as np, pandas as pd
          from bs4 import BeautifulSoup
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression

          BASE='https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/'
          def get_year(y):
              ref=f'{BASE}usdjpy/{y}'
              s=requests.Session(); r=s.get(ref,timeout=30); r.raise_for_status()
              soup=BeautifulSoup(r.content,'html.parser'); token=soup.find('input',{'id':'tk'}).attrs['value']
              form={'tk':token,'date':str(y),'datemonth':str(y),'platform':'ASCII','timeframe':'M1','fxpair':'USDJPY'}
              z=s.post('https://www.histdata.com/get.php',data=form,headers={'Referer':ref,'Origin':'https://www.histdata.com','User-Agent':'Mozilla/5.0'},timeout=90); z.raise_for_status()
              with zipfile.ZipFile(io.BytesIO(z.content)) as q:
                  raw=q.read([n for n in q.namelist() if n.lower().endswith('.csv')][0])
              x=pd.read_csv(io.BytesIO(raw),sep=';',header=None,usecols=[0,1,2,3,4],names=['dt','open','high','low','close'])
              x['dt']=pd.to_datetime(x.dt.astype(str),format='%Y%m%d %H%M%S')
              x=x.set_index('dt').sort_index()
              return x.resample('5min',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna()

          frames=[]
          for y in range(2000,2012):
              print('DOWNLOAD',y,flush=True); q=get_year(y); print(y,len(q),flush=True); frames.append(q); time.sleep(.2)
          b=pd.concat(frames).sort_index(); b=b[~b.index.duplicated(keep='last')]
          c=b.close
          e5=c.ewm(span=5,adjust=False).mean(); e9=c.ewm(span=9,adjust=False).mean(); e21=c.ewm(span=21,adjust=False).mean()
          e12=c.ewm(span=12,adjust=False).mean(); e26=c.ewm(span=26,adjust=False).mean(); macd=e12-e26; ms=macd.ewm(span=9,adjust=False).mean()
          d=c.diff(); g=d.clip(lower=0).ewm(alpha=1/14,adjust=False,min_periods=14).mean(); l=(-d.clip(upper=0)).ewm(alpha=1/14,adjust=False,min_periods=14).mean(); rsi=(100-100/(1+g/l.replace(0,np.nan))).fillna(50)
          pc=c.shift(); tr=pd.concat([b.high-b.low,(b.high-pc).abs(),(b.low-pc).abs()],axis=1).max(axis=1); atr=tr.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
          hi12=b.high.shift().rolling(12).max(); lo12=b.low.shift().rolling(12).min(); rg=(hi12-lo12).replace(0,np.nan)
          X=pd.DataFrame(index=b.index)
          X['ema5_9']=(e5-e9)/atr; X['ema9_21']=(e9-e21)/atr; X['rsi']=(rsi-50)/50; X['macdh']=(macd-ms)/atr
          X['mom5']=(c/c.shift(1)-1)/(atr/c); X['mom10']=(c/c.shift(2)-1)/(atr/c); X['mom15']=(c/c.shift(3)-1)/(atr/c)
          X['mom30']=(c/c.shift(6)-1)/(atr/c); X['range12']=(c-lo12)/rg*2-1; X['atrpct']=atr/c
          X['hsin']=np.sin(2*np.pi*b.index.hour/24); X['hcos']=np.cos(2*np.pi*b.index.hour/24)
          fc=list(X.columns)
          # Predict 10-minute move; ignore <=1 pip.
          fwd=c.shift(-2)-c; gap=pd.Series(b.index,index=b.index).shift(-2)-pd.Series(b.index,index=b.index); valid=gap<=pd.Timedelta(minutes=15)
          y=pd.Series(np.nan,index=b.index); y[(fwd>.01)&valid]=1; y[(fwd<-.01)&valid]=0
          ds=X.join(b[['open','high','low','close']]); ds['atr']=atr; ds['y']=y; ds=ds.replace([np.inf,-np.inf],np.nan)
          pre=ds[(ds.index<'2011-01-01')&ds.y.notna()].dropna(subset=fc).iloc[::2]
          sc=StandardScaler().fit(pre[fc]); m=LogisticRegression(C=.5,max_iter=400,class_weight='balanced',random_state=7).fit(sc.transform(pre[fc]),pre.y.astype(int))
          te=ds.loc['2011-01-03'].copy(); ok=te[fc].notna().all(axis=1); te['p']=np.nan; te.loc[ok,'p']=m.predict_proba(sc.transform(te.loc[ok,fc]))[:,1]

          # Intraday multi-trade design: one position at a time, no daily trade cap, 1-bar cooldown, max 15m hold.
          TH=.54; SPR=.02; ST=.8; RR=1.2; MAX_HOLD=3
          bal=10000.; peak=10000.; maxdd=0.; pos=None; pending=None; cool=0; trades=[]; R=list(te.itertuples())
          for i,r in enumerate(R):
              if cool>0: cool-=1
              if pending and pos is None:
                  di,cf,si=pending; sr=R[si]
                  lev=5 if cf<.57 else (10 if cf<.60 else (15 if cf<.64 else 25))
                  if np.isfinite(sr.atr) and sr.atr>0:
                      en=r.open+(SPR/2 if di==1 else -SPR/2)
                      pos={'d':di,'cf':cf,'lev':lev,'en':en,'sl':en-di*ST*sr.atr,'tp':en+di*ST*RR*sr.atr,'ei':i,'et':r.Index,'st':sr.Index,'bb':bal}
                  pending=None
              if pos:
                  di=pos['d']; ep=None; reason=None
                  hs=(r.low<=pos['sl']) if di==1 else (r.high>=pos['sl']); ht=(r.high>=pos['tp']) if di==1 else (r.low<=pos['tp'])
                  if hs: ep=pos['sl']-(SPR/2 if di==1 else -SPR/2); reason='SL'
                  elif ht: ep=pos['tp']-(SPR/2 if di==1 else -SPR/2); reason='TP'
                  elif i-pos['ei']>=MAX_HOLD: ep=r.close-(SPR/2 if di==1 else -SPR/2); reason='TIME'
                  elif i==len(R)-1: ep=r.close-(SPR/2 if di==1 else -SPR/2); reason='EOD'
                  if ep is not None:
                      ret=di*(ep-pos['en'])/pos['en']; pnl=bal*pos['lev']*ret; bal+=pnl
                      trades.append({**pos,'xt':r.Index,'xp':ep,'reason':reason,'pnl':pnl,'ba':bal}); peak=max(peak,bal); maxdd=max(maxdd,(peak-bal)/peak); pos=None; cool=1
              if pos is None and pending is None and cool==0 and i<len(R)-1 and np.isfinite(r.p):
                  if r.p>=TH: pending=(1,r.p,i)
                  elif r.p<=1-TH: pending=(-1,1-r.p,i)

          rows=[]
          for n,t in enumerate(trades,1): rows.append({'trade_no':n,'signal_time':t['st'],'entry_time':t['et'],'exit_time':t['xt'],'side':'LONG' if t['d']==1 else 'SHORT','confidence':t['cf'],'leverage':t['lev'],'entry':t['en'],'stop':t['sl'],'target':t['tp'],'exit':t['xp'],'reason':t['reason'],'pnl_yen':t['pnl'],'balance_before':t['bb'],'balance_after':t['ba']})
          pd.DataFrame(rows).to_csv('usdjpy_20110103_intraday_multi_trades.csv',index=False)
          wins=[t for t in trades if t['pnl']>0]; losses=[t for t in trades if t['pnl']<0]; gp=sum(t['pnl'] for t in wins); gl=-sum(t['pnl'] for t in losses)
          with open('usdjpy_20110103_intraday_multi_summary.txt','w') as f:
              f.write('DATE=2011-01-03\nSOURCE=HistData M1 -> 5m\n')
              f.write('MODEL=pre-2011 logistic regression, 10-minute direction target\n')
              f.write('RULES=threshold .54; no daily trade cap; one-position-at-a-time; 1-bar cooldown; max hold 15m; SL .8ATR; TP .96ATR; leverage 5/10/15/25x; max 25x; round-trip spread .02 JPY; signal close -> next bar open\n')
              f.write(f'TRADES={len(trades)}\nINITIAL=10000.00\nFINAL={bal:.2f}\nRETURN_PCT={(bal/10000-1)*100:.4f}%\nWINS={len(wins)}\nLOSSES={len(losses)}\nWIN_RATE={(100*len(wins)/len(trades) if trades else 0):.2f}%\nGROSS_PROFIT={gp:.2f}\nGROSS_LOSS={gl:.2f}\nPF={(gp/gl if gl else float("inf")):.4f}\nMAX_DD={maxdd*100:.4f}%\n')
          print(open('usdjpy_20110103_intraday_multi_summary.txt').read())
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usdjpy_20110103_intraday_multi_summary.txt usdjpy_20110103_intraday_multi_trades.csv
          git commit -m 'Add 2011-01-03 multi-trade intraday USDJPY results' || exit 0
          git push
