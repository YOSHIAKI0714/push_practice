name: USDJPY pre-2011 ML walk-forward v2
on:
  push:
    paths: ['.github/workflows/usdjpy_pre2011_ml_v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pandas numpy scikit-learn requests beautifulsoup4
      - name: Train and test
        run: |
          python - <<'PY'
          import io, zipfile, time, requests, numpy as np, pandas as pd
          from bs4 import BeautifulSoup
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          BASE='https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/'
          def gety(y):
              ref=f'{BASE}usdjpy/{y}'; s=requests.Session(); r=s.get(ref,timeout=30); r.raise_for_status(); soup=BeautifulSoup(r.content,'html.parser'); tk=soup.find('input',{'id':'tk'}).attrs['value']
              d={'tk':tk,'date':str(y),'datemonth':str(y),'platform':'ASCII','timeframe':'M1','fxpair':'USDJPY'}
              z=s.post('https://www.histdata.com/get.php',data=d,headers={'Referer':ref,'Origin':'https://www.histdata.com','User-Agent':'Mozilla/5.0'},timeout=90); z.raise_for_status()
              with zipfile.ZipFile(io.BytesIO(z.content)) as q: raw=q.read([n for n in q.namelist() if n.lower().endswith('.csv')][0])
              x=pd.read_csv(io.BytesIO(raw),sep=';',header=None,usecols=[0,1,2,3,4],names=['dt','open','high','low','close']); x.dt=pd.to_datetime(x.dt.astype(str),format='%Y%m%d %H%M%S'); x=x.set_index('dt').sort_index()
              return x.resample('5min').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna()
          fs=[]
          for y in range(2000,2012):
              print('DOWNLOAD',y,flush=True); b=gety(y); print(y,len(b),flush=True); fs.append(b); time.sleep(.25)
          b=pd.concat(fs).sort_index(); b=b[~b.index.duplicated()]; c=b.close
          e9=c.ewm(span=9,adjust=False).mean(); e21=c.ewm(span=21,adjust=False).mean(); e12=c.ewm(span=12,adjust=False).mean(); e26=c.ewm(span=26,adjust=False).mean(); macd=e12-e26; ms=macd.ewm(span=9,adjust=False).mean()
          d=c.diff(); g=d.clip(lower=0).ewm(alpha=1/14,adjust=False,min_periods=14).mean(); l=(-d.clip(upper=0)).ewm(alpha=1/14,adjust=False,min_periods=14).mean(); rsi=(100-100/(1+g/l.replace(0,np.nan))).fillna(100)
          pc=c.shift(); tr=pd.concat([b.high-b.low,(b.high-pc).abs(),(b.low-pc).abs()],axis=1).max(axis=1); atr=tr.ewm(alpha=1/14,adjust=False,min_periods=14).mean(); hi=b.high.shift().rolling(20).max(); lo=b.low.shift().rolling(20).min(); rg=(hi-lo).replace(0,np.nan)
          X=pd.DataFrame(index=b.index); X['ema_gap']=(e9-e21)/atr; X['rsi']=(rsi-50)/50; X['macdh']=(macd-ms)/atr; X['mom15']=(c/c.shift(3)-1)/(atr/c); X['mom60']=(c/c.shift(12)-1)/(atr/c); X['mom180']=(c/c.shift(36)-1)/(atr/c); X['range20']=(c-lo)/rg*2-1; X['atrpct']=atr/c; X['daymom']=c/c.shift(288)-1; X['hsin']=np.sin(2*np.pi*b.index.hour/24); X['hcos']=np.cos(2*np.pi*b.index.hour/24)
          fc=list(X.columns); fwd=c.shift(-6)-c; gap=pd.Series(b.index,index=b.index).shift(-6)-pd.Series(b.index,index=b.index); y=pd.Series(np.nan,index=b.index); okgap=gap<=pd.Timedelta(minutes=35); y[(fwd>.02)&okgap]=1; y[(fwd<-.02)&okgap]=0
          ds=X.join(b[['open','high','low','close']]); ds['atr']=atr; ds['y']=y; ds=ds.replace([np.inf,-np.inf],np.nan)
          fit=ds[(ds.index<'2008-01-01')&ds.y.notna()].dropna(subset=fc).iloc[::3]; sc=StandardScaler().fit(fit[fc]); m=LogisticRegression(C=.5,max_iter=400,class_weight='balanced',random_state=7).fit(sc.transform(fit[fc]),fit.y.astype(int))
          va=ds[(ds.index>='2008-01-01')&(ds.index<'2011-01-01')].copy(); ok=va[fc].notna().all(axis=1); va['p']=np.nan; va.loc[ok,'p']=m.predict_proba(sc.transform(va.loc[ok,fc]))[:,1]
          def bt(df,th,st,rr,initial=10000.):
              spr=.02; bal=initial; pk=initial; dd=0.; ts=[]; pos=None; pend=None; cnt={}; cool=0; R=list(df.itertuples())
              for i,r in enumerate(R):
                  if cool: cool-=1
                  if pend and pos is None:
                      di,cf,si=pend; sr=R[si]; day=str(r.Index.date()); lev=5 if cf<th+.04 else (15 if cf<th+.09 else 25)
                      if cnt.get(day,0)<6 and np.isfinite(sr.atr) and sr.atr>0:
                          en=r.open+(spr/2 if di==1 else -spr/2); pos={'d':di,'cf':cf,'lev':lev,'en':en,'sl':en-di*st*sr.atr,'tp':en+di*st*rr*sr.atr,'ei':i,'et':r.Index,'st':sr.Index,'bb':bal}; cnt[day]=cnt.get(day,0)+1
                      pend=None
                  if pos:
                      di=pos['d']; ep=None; reason=None; hs=(r.low<=pos['sl']) if di==1 else (r.high>=pos['sl']); ht=(r.high>=pos['tp']) if di==1 else (r.low<=pos['tp'])
                      if hs: ep=pos['sl']-(spr/2 if di==1 else -spr/2); reason='SL'
                      elif ht: ep=pos['tp']-(spr/2 if di==1 else -spr/2); reason='TP'
                      elif i-pos['ei']>=6 or i==len(R)-1: ep=r.close-(spr/2 if di==1 else -spr/2); reason='TIME'
                      if ep is not None:
                          ret=di*(ep-pos['en'])/pos['en']; pnl=bal*pos['lev']*ret; bal+=pnl; ts.append({**pos,'xt':r.Index,'xp':ep,'reason':reason,'pnl':pnl,'ba':bal}); pk=max(pk,bal); dd=max(dd,(pk-bal)/pk); pos=None; cool=3
                  if pos is None and pend is None and cool==0 and i<len(R)-1 and np.isfinite(r.p):
                      if r.p>=th: pend=(1,r.p,i)
                      elif r.p<=1-th: pend=(-1,1-r.p,i)
              gp=sum(max(t['pnl'],0) for t in ts); gl=-sum(min(t['pnl'],0) for t in ts); return {'final':bal,'ret':(bal/initial-1)*100,'n':len(ts),'w':sum(t['pnl']>0 for t in ts),'pf':gp/gl if gl else np.inf,'dd':dd*100,'tr':ts}
          cand=[]
          for th in [.56,.58,.60,.62,.64]:
              for st,rr in [(1,1.5),(1.2,1.8),(1.5,2)]:
                  ys=[bt(va.loc[str(q)],th,st,rr) for q in [2008,2009,2010]]; score=np.median([z['ret'] for z in ys])+.25*min(z['ret'] for z in ys)-.4*np.median([z['dd'] for z in ys])+2*(np.mean([min(z['pf'],5) for z in ys])-1); cand.append((score,th,st,rr,ys))
          cand.sort(key=lambda z:z[0],reverse=True); best=cand[0]
          pre=ds[(ds.index<'2011-01-01')&ds.y.notna()].dropna(subset=fc).iloc[::3]; sc2=StandardScaler().fit(pre[fc]); m2=LogisticRegression(C=.5,max_iter=400,class_weight='balanced',random_state=7).fit(sc2.transform(pre[fc]),pre.y.astype(int))
          te=ds.loc['2011-01-03'].copy(); ok=te[fc].notna().all(axis=1); te['p']=np.nan; te.loc[ok,'p']=m2.predict_proba(sc2.transform(te.loc[ok,fc]))[:,1]; res=bt(te,best[1],best[2],best[3])
          rows=[]
          for _,th,st,rr,ys in cand:
              rows.append({'threshold':th,'stop_atr':st,'rr':rr,**{f'ret_{yr}':z['ret'] for yr,z in zip([2008,2009,2010],ys)},**{f'dd_{yr}':z['dd'] for yr,z in zip([2008,2009,2010],ys)},**{f'pf_{yr}':z['pf'] for yr,z in zip([2008,2009,2010],ys)}})
          pd.DataFrame(rows).to_csv('usdjpy_pre2011_validation_v2.csv',index=False)
          pd.DataFrame([{'signal_time':t['st'],'entry_time':t['et'],'exit_time':t['xt'],'side':'LONG' if t['d']==1 else 'SHORT','confidence':t['cf'],'leverage':t['lev'],'entry':t['en'],'exit':t['xp'],'reason':t['reason'],'pnl_yen':t['pnl'],'balance_after':t['ba']} for t in res['tr']]).to_csv('usdjpy_20110103_ml_trades_v2.csv',index=False)
          with open('usdjpy_pre2011_ml_summary_v2.txt','w') as f:
              f.write(f'TOTAL_5M_BARS={len(b)}\nFIT_2000_2007={len(fit)}\nFINAL_PRE2011={len(pre)}\nBEST_THRESHOLD={best[1]}\nBEST_STOP_ATR={best[2]}\nBEST_RR={best[3]}\n')
              for yr,z in zip([2008,2009,2010],best[4]): f.write(f'VAL_{yr}=return {z["ret"]:.4f}%, dd {z["dd"]:.4f}%, pf {z["pf"]:.4f}, trades {z["n"]}\n')
              f.write(f'TEST_2011_01_03=final {res["final"]:.2f}, return {res["ret"]:.4f}%, trades {res["n"]}, wins {res["w"]}, winrate {(100*res["w"]/res["n"] if res["n"] else 0):.2f}%, pf {res["pf"]:.4f}, maxdd {res["dd"]:.4f}%\n')
              f.write('RULES=5m causal features; 30m direction model; next-bar entry; max 6 trades/day; cooldown 3 bars; max hold 6 bars; leverage 5/15/25x; max 25x; spread 0.02 JPY round-trip; SL before TP on same bar\n')
          print(open('usdjpy_pre2011_ml_summary_v2.txt').read())
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usdjpy_pre2011_ml_summary_v2.txt usdjpy_pre2011_validation_v2.csv usdjpy_20110103_ml_trades_v2.csv
          git commit -m 'Add USDJPY pre-2011 ML v2 results' || exit 0
          git push
