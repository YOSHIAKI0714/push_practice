name: USDJPY 2011 first 50 trades

on:
  push:
    paths: ['.github/workflows/usdjpy_2011_first50.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pandas numpy scikit-learn requests beautifulsoup4
      - name: Train on pre-2011 and run first 50 trades of 2011
        run: |
          python - <<'PY'
          import io, zipfile, time, requests, numpy as np, pandas as pd
          from bs4 import BeautifulSoup
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression

          BASE='https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/'
          def get_year(y):
              ref=f'{BASE}usdjpy/{y}'
              s=requests.Session(); r=s.get(ref,timeout=30); r.raise_for_status()
              soup=BeautifulSoup(r.content,'html.parser')
              token=soup.find('input',{'id':'tk'}).attrs['value']
              form={'tk':token,'date':str(y),'datemonth':str(y),'platform':'ASCII','timeframe':'M1','fxpair':'USDJPY'}
              z=s.post('https://www.histdata.com/get.php',data=form,headers={'Referer':ref,'Origin':'https://www.histdata.com','User-Agent':'Mozilla/5.0'},timeout=90)
              z.raise_for_status()
              with zipfile.ZipFile(io.BytesIO(z.content)) as q:
                  raw=q.read([n for n in q.namelist() if n.lower().endswith('.csv')][0])
              x=pd.read_csv(io.BytesIO(raw),sep=';',header=None,usecols=[0,1,2,3,4],names=['dt','open','high','low','close'])
              x['dt']=pd.to_datetime(x.dt.astype(str),format='%Y%m%d %H%M%S')
              x=x.set_index('dt').sort_index()
              return x.resample('5min',label='left',closed='left').agg({'open':'first','high':'max','low':'min','close':'last'}).dropna()

          frames=[]
          for y in range(2000,2012):
              print('DOWNLOAD',y,flush=True)
              b=get_year(y); print(y,len(b),flush=True); frames.append(b); time.sleep(.25)
          b=pd.concat(frames).sort_index(); b=b[~b.index.duplicated(keep='last')]
          c=b.close

          # Causal technical features.
          e9=c.ewm(span=9,adjust=False).mean(); e21=c.ewm(span=21,adjust=False).mean()
          e12=c.ewm(span=12,adjust=False).mean(); e26=c.ewm(span=26,adjust=False).mean(); macd=e12-e26; ms=macd.ewm(span=9,adjust=False).mean()
          d=c.diff(); g=d.clip(lower=0).ewm(alpha=1/14,adjust=False,min_periods=14).mean(); l=(-d.clip(upper=0)).ewm(alpha=1/14,adjust=False,min_periods=14).mean()
          rsi=(100-100/(1+g/l.replace(0,np.nan))).fillna(100)
          pc=c.shift(1); tr=pd.concat([b.high-b.low,(b.high-pc).abs(),(b.low-pc).abs()],axis=1).max(axis=1); atr=tr.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
          hi=b.high.shift(1).rolling(20).max(); lo=b.low.shift(1).rolling(20).min(); rg=(hi-lo).replace(0,np.nan)
          X=pd.DataFrame(index=b.index)
          X['ema_gap']=(e9-e21)/atr
          X['rsi']=(rsi-50)/50
          X['macdh']=(macd-ms)/atr
          X['mom15']=(c/c.shift(3)-1)/(atr/c)
          X['mom60']=(c/c.shift(12)-1)/(atr/c)
          X['mom180']=(c/c.shift(36)-1)/(atr/c)
          X['range20']=(c-lo)/rg*2-1
          X['atrpct']=atr/c
          X['daymom']=c/c.shift(288)-1
          X['hsin']=np.sin(2*np.pi*b.index.hour/24)
          X['hcos']=np.cos(2*np.pi*b.index.hour/24)
          fc=list(X.columns)

          # 30-minute direction label, ignoring <=2 pip moves.
          fwd=c.shift(-6)-c
          gap=pd.Series(b.index,index=b.index).shift(-6)-pd.Series(b.index,index=b.index)
          y=pd.Series(np.nan,index=b.index); okgap=gap<=pd.Timedelta(minutes=35)
          y[(fwd>.02)&okgap]=1; y[(fwd<-.02)&okgap]=0
          ds=X.join(b[['open','high','low','close']]); ds['atr']=atr; ds['y']=y; ds=ds.replace([np.inf,-np.inf],np.nan)

          # Final model fit uses only data available before 2011.
          pre=ds[(ds.index<'2011-01-01')&ds.y.notna()].dropna(subset=fc).iloc[::3]
          scaler=StandardScaler().fit(pre[fc])
          model=LogisticRegression(C=.5,max_iter=400,class_weight='balanced',random_state=7).fit(scaler.transform(pre[fc]),pre.y.astype(int))

          test=ds[(ds.index>='2011-01-03')&(ds.index<'2012-01-01')].copy()
          ok=test[fc].notna().all(axis=1); test['p']=np.nan
          test.loc[ok,'p']=model.predict_proba(scaler.transform(test.loc[ok,fc]))[:,1]

          # Fixed rule chosen before viewing 2011: threshold=.64, stop=1.2 ATR, RR=1.8.
          TH=.64; ST=1.2; RR=1.8; SPR=.02; TARGET_TRADES=50
          bal=10000.; peak=10000.; maxdd=0.; pos=None; pending=None; cool=0; daycount={}; trades=[]
          rows=list(test.itertuples())

          for i,r in enumerate(rows):
              if cool>0: cool-=1
              if pending and pos is None:
                  di,cf,si=pending; sr=rows[si]; day=str(r.Index.date())
                  lev=5 if cf<TH+.04 else (15 if cf<TH+.09 else 25)
                  if daycount.get(day,0)<6 and np.isfinite(sr.atr) and sr.atr>0:
                      entry=r.open+(SPR/2 if di==1 else -SPR/2)
                      pos={'d':di,'cf':cf,'lev':lev,'entry':entry,'sl':entry-di*ST*sr.atr,'tp':entry+di*ST*RR*sr.atr,
                           'entry_i':i,'entry_time':r.Index,'signal_time':sr.Index,'balance_before':bal}
                      daycount[day]=daycount.get(day,0)+1
                  pending=None

              if pos is not None:
                  di=pos['d']; exitp=None; reason=None
                  hit_sl=(r.low<=pos['sl']) if di==1 else (r.high>=pos['sl'])
                  hit_tp=(r.high>=pos['tp']) if di==1 else (r.low<=pos['tp'])
                  if hit_sl:
                      exitp=pos['sl']-(SPR/2 if di==1 else -SPR/2); reason='SL'
                  elif hit_tp:
                      exitp=pos['tp']-(SPR/2 if di==1 else -SPR/2); reason='TP'
                  elif i-pos['entry_i']>=6:
                      exitp=r.close-(SPR/2 if di==1 else -SPR/2); reason='TIME'
                  if exitp is not None:
                      ret=di*(exitp-pos['entry'])/pos['entry']
                      pnl=bal*pos['lev']*ret
                      bal+=pnl
                      t={**pos,'exit_time':r.Index,'exit':exitp,'reason':reason,'ret':ret,'pnl':pnl,'balance_after':bal}
                      trades.append(t)
                      peak=max(peak,bal); maxdd=max(maxdd,(peak-bal)/peak)
                      pos=None; cool=3
                      if len(trades)>=TARGET_TRADES:
                          break

              if pos is None and pending is None and cool==0 and i<len(rows)-1 and np.isfinite(r.p):
                  if r.p>=TH: pending=(1,r.p,i)
                  elif r.p<=1-TH: pending=(-1,1-r.p,i)

          out=[]
          for n,t in enumerate(trades,1):
              out.append({'trade_no':n,'signal_time':t['signal_time'],'entry_time':t['entry_time'],'exit_time':t['exit_time'],
                          'side':'LONG' if t['d']==1 else 'SHORT','confidence':t['cf'],'leverage':t['lev'],'entry':t['entry'],
                          'stop':t['sl'],'target':t['tp'],'exit':t['exit'],'reason':t['reason'],'pnl_yen':t['pnl'],
                          'balance_before':t['balance_before'],'balance_after':t['balance_after']})
          pd.DataFrame(out).to_csv('usdjpy_2011_first50_trades.csv',index=False)

          wins=[t for t in trades if t['pnl']>0]; losses=[t for t in trades if t['pnl']<0]
          gp=sum(t['pnl'] for t in wins); gl=-sum(t['pnl'] for t in losses)
          max_win=max((t['pnl'] for t in trades),default=0); max_loss=min((t['pnl'] for t in trades),default=0)
          # streaks
          max_ws=max_ls=ws=ls=0
          for t in trades:
              if t['pnl']>0: ws+=1; ls=0; max_ws=max(max_ws,ws)
              elif t['pnl']<0: ls+=1; ws=0; max_ls=max(max_ls,ls)
          lev_counts={5:0,15:0,25:0}
          side_counts={'LONG':0,'SHORT':0}
          reasons={}
          for t in trades:
              lev_counts[t['lev']]+=1; side_counts['LONG' if t['d']==1 else 'SHORT']+=1; reasons[t['reason']]=reasons.get(t['reason'],0)+1
          with open('usdjpy_2011_first50_summary.txt','w') as f:
              f.write('SOURCE=HistData official annual ASCII M1; resampled to 5m\n')
              f.write('SOURCE_TIMEZONE=EST fixed, no DST\n')
              f.write('MODEL=StandardScaler + balanced LogisticRegression(C=0.5), trained only on pre-2011 5m data; 30m direction target\n')
              f.write('RULES=threshold 0.64; stop 1.2 ATR; target 2.16 ATR; next-bar entry; max 6 trades/day; 3-bar cooldown; max hold 6 bars; leverage 5/15/25x; max 25x; round-trip spread 0.02 JPY; same-bar SL before TP\n')
              f.write(f'TRADES={len(trades)}\n')
              if trades:
                  f.write(f'FIRST_SIGNAL={trades[0]["signal_time"]}\nFIRST_ENTRY={trades[0]["entry_time"]}\nLAST_EXIT={trades[-1]["exit_time"]}\n')
              f.write(f'INITIAL_BALANCE=10000.00\nFINAL_BALANCE={bal:.2f}\nRETURN_PCT={(bal/10000-1)*100:.4f}%\n')
              f.write(f'WINS={len(wins)}\nLOSSES={len(losses)}\nWIN_RATE={(100*len(wins)/len(trades) if trades else 0):.2f}%\n')
              f.write(f'GROSS_PROFIT={gp:.2f}\nGROSS_LOSS={gl:.2f}\nPROFIT_FACTOR={(gp/gl if gl else float("inf")):.4f}\nMAX_DRAWDOWN_PCT={maxdd*100:.4f}%\n')
              f.write(f'AVG_WIN={(gp/len(wins) if wins else 0):.2f}\nAVG_LOSS={(-gl/len(losses) if losses else 0):.2f}\nMAX_WIN={max_win:.2f}\nMAX_LOSS={max_loss:.2f}\nMAX_WIN_STREAK={max_ws}\nMAX_LOSS_STREAK={max_ls}\n')
              f.write(f'LEVERAGE_COUNTS={lev_counts}\nSIDE_COUNTS={side_counts}\nEXIT_REASONS={reasons}\n')
          print(open('usdjpy_2011_first50_summary.txt').read())
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usdjpy_2011_first50_summary.txt usdjpy_2011_first50_trades.csv
          git commit -m 'Add first 50 USDJPY trades for 2011' || exit 0
          git push
